name: Build Andour

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Full history needed for 'git describe' versioning
    - name: Ensure git tags exist
      run: |
        git config --global user.email "ci@ardour.org"
        git config --global user.name "CI"
        if [ -z "$(git tag)" ]; then
          echo "No tags found, creating a dummy tag for versioning"
          git tag -a 7.0-dummy -m "Dummy tag for CI versioning"
        fi

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          pkg-config \
          python3 \
          git \
          libglib2.0-dev \
          libglibmm-2.4-dev \
          libsndfile1-dev \
          libcurl4-gnutls-dev \
          libarchive-dev \
          liblo-dev \
          libtag1-dev \
          vamp-plugin-sdk \
          librubberband-dev \
          libfftw3-dev \
          libxml2-dev \
          libaubio-dev \
          libasound2-dev \
          libjack-jackd2-dev \
          libpulse-dev \
          libusb-1.0-0-dev \
          libcppunit-dev \
          itstool \
          gettext \
          libboost-dev \
          libgtk2.0-dev \
          libatk1.0-dev \
          libpango1.0-dev \
          libcairo2-dev \
          liblrdf0-dev \
          libsamplerate0-dev \
          libwebsockets-dev \
          libreadline-dev \
          libpangomm-1.4-dev \
          libcairomm-1.0-dev \
          libsigc++-2.0-dev \
          libfluidsynth-dev \
          libudev-dev \
          lv2-dev \
          libserd-dev \
          libsord-dev \
          libsratom-dev \
          liblilv-dev \
          libsuil-dev \
          libdbus-1-dev \
          libflac-dev \
          libfontconfig1-dev \
          libhidapi-dev \
          libpng-dev \
          libltc-dev \
          libogg-dev \
          libsoundtouch-dev \
          libx11-dev \
          libxext-dev \
          libxi-dev \
          libxrandr-dev \
          libcwiid-dev \
          ccache

    - name: Cache Build
      uses: actions/cache@v4
      with:
        path: build/
        key: ${{ runner.os }}-waf-${{ hashFiles('wscript', '**/wscript') }}
        restore-keys: |
          ${{ runner.os }}-waf-

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Configure
      run: |
        export PATH="/usr/lib/ccache:$PATH"
        python3 ./waf configure --optimize --with-backends=alsa,dummy,jack --noconfirm

    - name: Build
      run: |
        export PATH="/usr/lib/ccache:$PATH"
        python3 ./waf build -j$(nproc)

    - name: Install to local directory
      run: |
        python3 ./waf install --destdir=./install_root

    - name: Prepare Artifact
      run: |
        mkdir -p output
        cp -r install_root/usr/local/* output/
        # Create a compressed archive
        tar -czf ardour-linux-x86_64.tar.gz -C output .

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ardour-linux-bundle
        path: ardour-linux-x86_64.tar.gz

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
      with:
        tag_name: latest
        files: ardour-linux-x86_64.tar.gz
        name: "Continuous Build"
        body: "Automated build of Ardour (Andour) for Linux x86_64"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
